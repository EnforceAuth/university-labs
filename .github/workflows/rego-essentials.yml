name: rego-essentials

on:
  pull_request:
    paths:
      - "courses/rego-essentials/**"
      - ".github/workflows/rego-essentials.yml"

permissions:
  contents: read

jobs:
  labs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install OPA 1.22.0
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/opa "https://github.com/open-policy-agent/opa/releases/download/v1.22.0/opa_linux_amd64_static"
          sudo install -m 0755 /tmp/opa /usr/local/bin/opa
          opa version | grep -q '^Version: 1.22.0$'

      - name: Run labs
        run: bash courses/rego-essentials/run_labs.sh
